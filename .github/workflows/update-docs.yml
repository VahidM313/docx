name: Build & Publish Docx App (Windows + Android) + Docs Library

on:
  schedule:
    # Once a day: each run re-uploads the library, so all sites share one run and one upload.
    - cron: "20 0 * * *"
  push:
    branches:
      - main
    paths:
      - "docs-desktop/**"
      - "scripts/**"
      - ".github/workflows/update-docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs-desktop/**"
      - "scripts/**"
      - ".github/workflows/update-docs.yml"
  workflow_dispatch:
    inputs:
      sites:
        description: "Site IDs to build: 'missing' (only unbuilt packs), 'all' (all packs and both apps), 'none' (only Docx.exe & Android APK), 'local:<ids>' (publish hand-built packs, see scripts/build-local.ts), or comma-separated IDs (e.g. redis,duckdb)"
        required: false
        default: "missing"

permissions:
  contents: write

env:
  RELEASE_TAG: packs-latest
  # Every docpack in one file. Clients read byte ranges of it, never the whole file.
  LIBRARY: Docx-library.bin
  # Packs built on a laptop for sites that refuse GitHub's runners wait here.
  LOCAL_PACKS_TAG: docpacks-v3

jobs:
  build-desktop-app:
    name: Build Docx.exe (Windows x64)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.sites == 'none' || github.event.inputs.sites == 'all'))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Compile Docx-core.exe
        working-directory: docs-desktop
        env:
          DOCX_BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $env:DOCX_BUILD_COMMIT = $env:DOCX_BUILD_COMMIT.Substring(0, 8)
          bun install --frozen-lockfile || bun install
          bun run build
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Docx.exe & Upload to Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $shortSha = $env:SHORT_SHA.Substring(0, 8)
          gh release view packs-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Standalone Docx.exe, Android Docx.apk, delta-updatable Docx-core.exe, and 123 content-hashed Max-Gzip .docpack archives."
          }

          New-Item -ItemType Directory -Force -Path "./ci-dist" | Out-Null
          # Docx.exe is the download; apps that update themselves fetch Docx-core.exe.
          Copy-Item "docs-desktop/src-tauri/target/release/app.exe" "./ci-dist/Docx.exe" -Force
          Copy-Item "./ci-dist/Docx.exe" "./ci-dist/Docx-core.exe" -Force

          bun -e '
            const fs = require("fs");
            const size = fs.statSync("./ci-dist/Docx.exe").size;
            const appManifest = {
              commit: process.env.SHORT_SHA.slice(0, 8),
              version: "v1.1.0",
              updatedAt: new Date().toISOString(),
              coreSizeBytes: size,
              fullSizeBytes: size
            };
            fs.writeFileSync("./ci-dist/app-manifest.json", JSON.stringify(appManifest, null, 2));
          '

          gh release upload packs-latest "./ci-dist/Docx.exe" "./ci-dist/Docx-core.exe" "./ci-dist/app-manifest.json" --clobber

  build-android-app:
    name: Build Docx Android Release APK (ARMv8 / aarch64)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.sites == 'none' || github.event.inputs.sites == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Build Frontend
        working-directory: docs-desktop
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Build Android ARMv8 Release APK
        working-directory: docs-desktop
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          bun run tauri android build -t aarch64 --apk --ci

      - name: Upload Android Release APK to Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view packs-latest >/dev/null 2>&1 || gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Docx standalone binaries and 123 .docpack archives."
          cp docs-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Docx-arm64-v8a-release.apk
          gh release upload packs-latest "./Docx-arm64-v8a-release.apk" --clobber

  prepare-matrix:
    name: Prepare Docpack Matrix
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sites != 'none')
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Catalog consistency gate (sites.d ↔ sites.json)
        run: bun scripts/gen-catalog.ts --check

      - name: Ensure the release exists & resolve matrix
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SITES: ${{ github.event.inputs.sites || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Docx Offline Documentation Hub (Latest)" --notes "Docx binaries and the docs library. The app reads only the byte ranges it needs from the library."
          export PUBLISHED_IDS="$(bun scripts/library.ts ids)"
          bun -e '
            const fs = require("fs");
            const { SITE_CATALOG } = require("./scripts/ci-build-site.ts");
            const allIds = SITE_CATALOG.map(s => s.id);
            // These refuse the runners, so only an explicit request crawls them here
            const crawlable = SITE_CATALOG.filter(s => !s.localBuild).map(s => s.id);
            const mode = process.env.INPUT_SITES || "";
            const eventName = process.env.EVENT_NAME;

            const published = new Set(JSON.parse(process.env.PUBLISHED_IDS));
            const missingIds = crawlable.filter(id => !published.has(id));
            let resolved = [];

            if (eventName === "schedule" || mode === "all") {
              resolved = crawlable;
            } else if (mode === "none" || mode.startsWith("local:")) {
              resolved = [];
            } else if (mode && mode !== "missing") {
              resolved = mode.split(",").map(s => s.trim()).filter(s => allIds.includes(s));
            } else {
              resolved = missingIds;
            }

            console.log(`Resolved ${resolved.length} sites to build:`, resolved);
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `sites=${JSON.stringify(resolved)}\n`);
            fs.appendFileSync(out, `count=${resolved.length}\n`);
          '

  build-pack:
    name: Build Pack (${{ matrix.site }})
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        site: ${{ fromJson(needs.prepare-matrix.outputs.sites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch the site's previous pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/library.ts extract "${{ matrix.site }}" ./dist-packs

      - name: Install a browser for sites that only render in one
        if: matrix.site == 'nestjs'
        run: |
          bun add --no-save playwright
          bunx playwright install --with-deps chromium

      - name: Build .docpack from the previous pack (with regression guard)
        run: bun run scripts/ci-build-site.ts "${{ matrix.site }}" ./dist-packs

      - name: Hand a changed pack to the publish job
        if: hashFiles(format('dist-packs/{0}.changed', matrix.site)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.site }}
          path: dist-packs/${{ matrix.site }}.docpack
          retention-days: 1
          compression-level: 0

  publish-library:
    name: Publish the docs library
    needs: [prepare-matrix, build-pack]
    if: always() && needs.prepare-matrix.result == 'success' && (needs.prepare-matrix.outputs.count != '0' || startsWith(github.event.inputs.sites, 'local:')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-library
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Collect the changed packs
        if: ${{ !startsWith(github.event.inputs.sites, 'local:') }}
        uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: ./changed-packs
          merge-multiple: true

      - name: Collect hand-built packs
        if: startsWith(github.event.inputs.sites, 'local:')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SITES: ${{ github.event.inputs.sites }}
        run: |
          mkdir -p ./changed-packs
          ids="${INPUT_SITES#local:}"
          for id in ${ids//,/ }; do
            gh release download "$LOCAL_PACKS_TAG" --pattern "$id.docpack" --dir ./changed-packs --clobber
          done

      - name: Compose, upload and swap in the new library
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A ./changed-packs 2>/dev/null)" ]; then
            echo "No pack changed, so the published library stays as it is."
            exit 0
          fi

          assets="repos/$GITHUB_REPOSITORY/releases/assets"
          asset_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$1\") | .id"
          }

          # A job killed mid-publish leaves these behind; the library must be back in place first.
          stale_next=$(asset_id "$LIBRARY.next")
          if [ -n "$stale_next" ]; then gh api -X DELETE "$assets/$stale_next"; fi
          stale_previous=$(asset_id "$LIBRARY.previous")
          if [ -n "$stale_previous" ]; then
            if [ -n "$(asset_id "$LIBRARY")" ]; then
              gh api -X DELETE "$assets/$stale_previous"
            else
              gh api -X PATCH "$assets/$stale_previous" -f name="$LIBRARY" --silent
            fi
          fi

          gh release download "$RELEASE_TAG" --pattern "$LIBRARY" --output ./previous-library.bin || true
          mkdir -p ./upload
          bun scripts/library.ts compose ./changed-packs "./upload/$LIBRARY.next" ./previous-library.bin
          gh release upload "$RELEASE_TAG" "./upload/$LIBRARY.next"

          # Renaming keeps one stable URL for clients, and the swap takes a second.
          next=$(asset_id "$LIBRARY.next")
          current=$(asset_id "$LIBRARY")
          if [ -n "$current" ]; then gh api -X PATCH "$assets/$current" -f name="$LIBRARY.previous" --silent; fi
          gh api -X PATCH "$assets/$next" -f name="$LIBRARY" --silent

          # GitHub keeps resolving the name to the old asset for about two minutes after a
          # rename, so that asset has to outlive the swap or clients would get a 404.
          if [ -n "$current" ]; then
            sleep 240
            gh api -X DELETE "$assets/$current"
          fi
