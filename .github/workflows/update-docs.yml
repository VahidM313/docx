name: Build & Publish Docx App (Windows + Android) + 123 Docpacks

on:
  schedule:
    # Hourly batches between 12 AM and 6 AM UTC (00:20, 01:20, 02:20, 03:20, 04:20, 05:20)
    # Partitions the 145 docpacks into 6 balanced batches (~24 packs each) so doc sites are never spammed at once.
    - cron: "20 0,1,2,3,4,5 * * *"
  push:
    branches:
      - main
    paths:
      - "docs-desktop/**"
      - "scripts/**"
      - ".github/workflows/update-docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs-desktop/**"
      - "scripts/**"
      - ".github/workflows/update-docs.yml"
  workflow_dispatch:
    inputs:
      sites:
        description: "Site IDs to build: 'missing' (only unbuilt packs), 'all' (all 145 packs), 'batch:0'..'batch:5' (specific batch), 'none' (only Docx.exe & Android APK), or comma-separated IDs (e.g. redis,duckdb)"
        required: false
        default: "missing"

permissions:
  contents: write

env:
  # v3 packs and registry.json. App binaries and icons stay on packs-latest, whose
  # v2 packs keep already-installed apps working until they self-update.
  PACKS_TAG: docpacks-v3

jobs:
  build-desktop-app:
    name: Build Docx.exe & Docx-core.exe (Windows x64)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.sites == 'none' || github.event.inputs.sites == 'all'))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Compile Docx-core.exe
        working-directory: docs-desktop
        env:
          DOCX_BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $env:DOCX_BUILD_COMMIT = $env:DOCX_BUILD_COMMIT.Substring(0, 8)
          bun install --frozen-lockfile || bun install
          bun run build
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Docx-core.exe + Standalone Docx.exe (with DOCXPACK trailer) & Upload to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $shortSha = $env:SHORT_SHA.Substring(0, 8)
          gh release view packs-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Standalone Docx.exe, Android Docx.apk, delta-updatable Docx-core.exe, and 123 content-hashed Max-Gzip .docpack archives."
          }

          New-Item -ItemType Directory -Force -Path "./ci-dist" | Out-Null
          Copy-Item "docs-desktop/src-tauri/target/release/app.exe" "./ci-dist/Docx-core.exe" -Force

          # Embed tailwind.docpack and shadcn.docpack in the standalone Docx.exe trailer.
          # packs-latest is the fallback for the first build, before any v3 pack exists.
          gh release download $env:PACKS_TAG --pattern "tailwind.docpack" --pattern "shadcn.docpack" --dir "./ci-dist" --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release download packs-latest --pattern "tailwind.docpack" --pattern "shadcn.docpack" --dir "./ci-dist" --clobber
          }

          bun -e '
            const fs = require("fs");
            const coreBytes = fs.readFileSync("./ci-dist/Docx-core.exe");
            const trailerChunks = [];
            for (const f of ["./ci-dist/tailwind.docpack", "./ci-dist/shadcn.docpack"]) {
              if (fs.existsSync(f)) {
                const b = fs.readFileSync(f);
                const lenBuf = Buffer.alloc(4);
                lenBuf.writeUInt32LE(b.length, 0);
                trailerChunks.push(lenBuf, b);
              }
            }
            const trailerPayload = Buffer.concat(trailerChunks);
            const footer = Buffer.alloc(16);
            footer.writeBigUInt64LE(BigInt(trailerPayload.length), 0);
            footer.write("DOCXPACK", 8, "ascii");
            const fullExe = Buffer.concat([coreBytes, trailerPayload, footer]);
            fs.writeFileSync("./ci-dist/Docx.exe", fullExe);

            const appManifest = {
              commit: process.env.SHORT_SHA.slice(0, 8),
              version: "v1.1.0",
              updatedAt: new Date().toISOString(),
              coreSizeBytes: coreBytes.length,
              fullSizeBytes: fullExe.length
            };
            fs.writeFileSync("./ci-dist/app-manifest.json", JSON.stringify(appManifest, null, 2));
            console.log("Built Docx-core.exe:", (coreBytes.length / 1048576).toFixed(2), "MB, Standalone Docx.exe:", (fullExe.length / 1048576).toFixed(2), "MB");
          '

          gh release upload packs-latest "./ci-dist/Docx.exe" "./ci-dist/Docx-core.exe" "./ci-dist/app-manifest.json" --clobber

  build-android-app:
    name: Build Docx Android Release APK (ARMv8 / aarch64)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.sites == 'none' || github.event.inputs.sites == 'all'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Build Frontend
        working-directory: docs-desktop
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Build Android ARMv8 Release APK
        working-directory: docs-desktop
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          bun run tauri android build -t aarch64 --apk --ci

      - name: Upload Android Release APK to Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view packs-latest >/dev/null 2>&1 || gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Docx standalone binaries and 123 .docpack archives."
          cp docs-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Docx-arm64-v8a-release.apk
          gh release upload packs-latest "./Docx-arm64-v8a-release.apk" --clobber

  prepare-matrix:
    name: Prepare Docpack Matrix
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sites != 'none')
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Catalog consistency gate (sites.d ↔ sites.json)
        run: bun scripts/gen-catalog.ts --check

      - name: Ensure releases exist & resolve matrix
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SITES: ${{ github.event.inputs.sites || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh release view packs-latest >/dev/null 2>&1 || gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Docx binaries and site icons."
          gh release view "$PACKS_TAG" >/dev/null 2>&1 || gh release create "$PACKS_TAG" --latest=false --title "Docx Docpacks (v3)" --notes "Content-defined .docpack archives. The app updates them with HTTP range requests, fetching only the chunks it lacks."
          bun -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const { SITE_CATALOG } = require("./scripts/ci-build-site.ts");
            const allIds = SITE_CATALOG.map(s => s.id);
            let mode = process.env.INPUT_SITES || "";
            const eventName = process.env.EVENT_NAME;

            let existingPacks = new Set();
            try {
              const out = execSync(`gh release view ${process.env.PACKS_TAG} --json assets`, { encoding: "utf8" });
              const json = JSON.parse(out);
              existingPacks = new Set(
                (json.assets || [])
                  .map(a => a.name)
                  .filter(n => n.endsWith(".docpack"))
                  .map(n => n.replace(".docpack", ""))
              );
            } catch (e) {
              console.warn("Could not query release assets:", e);
            }

            const missingIds = allIds.filter(id => !existingPacks.has(id));
            let resolved = [];

            if (eventName === "schedule") {
              // Between 12 AM and 6 AM UTC (hours 0..5), run one shard (1/6th of sites) per hour
              const hour = new Date().getUTCHours();
              const shard = hour % 6;
              const batchSites = allIds.filter((_, idx) => idx % 6 === shard);
              // Include the scheduled hourly shard + up to 5 missing packs (capped at 30 to prevent network spam)
              const combined = Array.from(new Set([...batchSites, ...missingIds])).slice(0, 30);
              resolved = combined;
              console.log(`[Scheduled Update: Hour ${hour} UTC -> Batch ${shard}/6] Selected ${resolved.length} sites (${batchSites.length} in batch, ${missingIds.length} missing):`, resolved);
            } else if (mode.startsWith("batch:")) {
              const shard = parseInt(mode.replace("batch:", ""), 10) % 6;
              resolved = allIds.filter((_, idx) => idx % 6 === shard);
            } else if (mode === "all") {
              resolved = allIds;
            } else if (mode === "missing" || (!mode && eventName === "push")) {
              resolved = missingIds;
            } else if (mode === "none") {
              resolved = [];
            } else if (mode) {
              resolved = mode.split(",").map(s => s.trim()).filter(s => allIds.includes(s));
            } else {
              resolved = missingIds;
            }

            console.log(`Resolved ${resolved.length} sites to build:`, resolved);
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `sites=${JSON.stringify(resolved)}\n`);
            fs.appendFileSync(out, `count=${resolved.length}\n`);
          '

  build-pack:
    name: Build Pack (${{ matrix.site }})
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJson(needs.prepare-matrix.outputs.sites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build .docpack from the previous pack (with regression guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist-packs
          gh release download "$PACKS_TAG" --pattern "${{ matrix.site }}.docpack" --dir ./dist-packs --clobber || true
          # First v3 build of a site: its v2 pack still guards against a short crawl
          if [ ! -f "./dist-packs/${{ matrix.site }}.docpack" ]; then
            gh release download packs-latest --pattern "${{ matrix.site }}.docpack" --pattern "${{ matrix.site }}.search.json" --dir ./dist-packs --clobber || true
          fi
          bun run scripts/ci-build-site.ts "${{ matrix.site }}" ./dist-packs

      - name: Upload Pack to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "./dist-packs/${{ matrix.site }}.changed" ]; then
            gh release upload "$PACKS_TAG" "./dist-packs/${{ matrix.site }}.docpack" --clobber
            echo "Successfully uploaded ${{ matrix.site }} docpack."
          else
            echo "Pack ${{ matrix.site }} has no new content (existing release preserved)."
          fi

  refresh-icons:
    name: Capture Site Icons (hybrid favicon strategy)
    needs: [prepare-matrix, build-pack]
    if: always() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.count != '0' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download previously cached icons from packs-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./docs-desktop/catalog/icons
          gh release download packs-latest --pattern "*.icon.png" --pattern "*.meta.json" --dir ./docs-desktop/catalog/icons --clobber || true

      - name: Capture missing / stale icons (cached by source ETag + content hash)
        timeout-minutes: 20
        continue-on-error: true
        run: bun scripts/capture-icons.ts

      - name: Upload icon assets to packs-latest
        if: always() && hashFiles('docs-desktop/catalog/icons/*.icon.png') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload packs-latest ./docs-desktop/catalog/icons/*.icon.png ./docs-desktop/catalog/icons/*.meta.json --clobber

  update-registry:
    name: Update Master registry.json
    needs: [prepare-matrix, build-pack, refresh-icons]
    if: always() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.count != '0' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Rebuild & upload master registry.json from the pack headers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./rel-icons
          # Icon assets feed the iconETag freshness anchors in the registry
          gh release download packs-latest --pattern "*.icon.png" --dir ./rel-icons --clobber || true
          bun scripts/build-registry.ts "$PACKS_TAG" ./rel-icons ./registry.json
          gh release upload "$PACKS_TAG" ./registry.json --clobber
