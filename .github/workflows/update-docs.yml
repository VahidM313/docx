name: Build & Publish Docx App (Windows + Android) + 123 Docpacks

on:
  push:
    branches:
      - main
    paths:
      - "docs-desktop/**"
      - "scripts/**"
      - ".github/workflows/update-docs.yml"
  workflow_dispatch:
    inputs:
      sites:
        description: "Site IDs to build: 'all' (all 145 packs, forced rebuild), 'missing' (only unbuilt packs), 'none' (only Docx.exe & Android APK), or comma-separated IDs (e.g. redis,duckdb)"
        required: false
        default: "all"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  build-desktop-app:
    name: Build Docx.exe & Docx-core.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Compile Docx-core.exe
        working-directory: docs-desktop
        env:
          DOCX_BUILD_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $env:DOCX_BUILD_COMMIT = $env:DOCX_BUILD_COMMIT.Substring(0, 8)
          bun install --frozen-lockfile || bun install
          bun run build
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package Docx-core.exe + Standalone Docx.exe (with DOCXPACK trailer) & Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $shortSha = $env:SHORT_SHA.Substring(0, 8)
          gh release view packs-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Standalone Docx.exe, Android Docx.apk, delta-updatable Docx-core.exe, and 123 content-hashed Max-Gzip .docpack archives."
          }

          New-Item -ItemType Directory -Force -Path "./ci-dist" | Out-Null
          Copy-Item "docs-desktop/src-tauri/target/release/app.exe" "./ci-dist/Docx-core.exe" -Force

          # Download tailwind.docpack and shadcn.docpack from packs-latest to embed in standalone Docx.exe trailer
          gh release download packs-latest --pattern "tailwind.docpack" --pattern "shadcn.docpack" --dir "./ci-dist" --clobber

          bun -e '
            const fs = require("fs");
            const coreBytes = fs.readFileSync("./ci-dist/Docx-core.exe");
            const trailerChunks = [];
            for (const f of ["./ci-dist/tailwind.docpack", "./ci-dist/shadcn.docpack"]) {
              if (fs.existsSync(f)) {
                const b = fs.readFileSync(f);
                const lenBuf = Buffer.alloc(4);
                lenBuf.writeUInt32LE(b.length, 0);
                trailerChunks.push(lenBuf, b);
              }
            }
            const trailerPayload = Buffer.concat(trailerChunks);
            const footer = Buffer.alloc(16);
            footer.writeBigUInt64LE(BigInt(trailerPayload.length), 0);
            footer.write("DOCXPACK", 8, "ascii");
            const fullExe = Buffer.concat([coreBytes, trailerPayload, footer]);
            fs.writeFileSync("./ci-dist/Docx.exe", fullExe);

            const appManifest = {
              commit: process.env.SHORT_SHA.slice(0, 8),
              version: "v1.1.0",
              updatedAt: new Date().toISOString(),
              coreSizeBytes: coreBytes.length,
              fullSizeBytes: fullExe.length
            };
            fs.writeFileSync("./ci-dist/app-manifest.json", JSON.stringify(appManifest, null, 2));
            console.log("Built Docx-core.exe:", (coreBytes.length / 1048576).toFixed(2), "MB, Standalone Docx.exe:", (fullExe.length / 1048576).toFixed(2), "MB");
          '

          gh release upload packs-latest "./ci-dist/Docx.exe" "./ci-dist/Docx-core.exe" "./ci-dist/app-manifest.json" --clobber

  build-android-app:
    name: Build Docx Android Release APK (ARMv8 / aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "docs-desktop/src-tauri -> target"

      - name: Install Frontend Dependencies & Build Frontend
        working-directory: docs-desktop
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Build Android ARMv8 Release APK
        working-directory: docs-desktop
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          bun run tauri android build -t aarch64 --apk --ci

      - name: Upload Android Release APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view packs-latest >/dev/null 2>&1 || gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Docx standalone binaries and 123 .docpack archives."
          cp docs-desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ./Docx-arm64-v8a-release.apk
          cp ./Docx-arm64-v8a-release.apk ./Docx.apk
          gh release upload packs-latest "./Docx-arm64-v8a-release.apk" "./Docx.apk" --clobber

  prepare-matrix:
    name: Prepare Docpack Matrix
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sites != 'none')
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Catalog consistency gate (sites.d ↔ sites.json)
        run: bun scripts/gen-catalog.ts --check

      - name: Ensure packs-latest release exists & resolve matrix
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SITES: ${{ github.event.inputs.sites || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh release view packs-latest >/dev/null 2>&1 || gh release create packs-latest --title "Docx 123-Site Offline Documentation Hub & Packs (Latest)" --notes "Content-hashed Max-Gzip .docpack archives supporting HTTP 206 Partial Range delta updates."
          bun -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const { SITE_CATALOG } = require("./scripts/ci-build-site.ts");
            const allIds = SITE_CATALOG.map(s => s.id);
            let mode = process.env.INPUT_SITES;
            if (!mode || mode === "" || mode === "missing") {
              mode = "all";
            }

            let resolved = [];
            if (mode === "all") {
              resolved = allIds;
            } else if (mode === "missing") {
              let existingPacks = new Set();
              try {
                const out = execSync("gh release view packs-latest --json assets", { encoding: "utf8" });
                const json = JSON.parse(out);
                existingPacks = new Set(
                  (json.assets || [])
                    .map(a => a.name)
                    .filter(n => n.endsWith(".docpack"))
                    .map(n => n.replace(".docpack", ""))
                );
              } catch (e) {
                console.warn("Could not query packs-latest assets:", e);
              }
              resolved = allIds.filter(id => !existingPacks.has(id));
            } else {
              resolved = mode.split(",").map(s => s.trim()).filter(s => allIds.includes(s));
            }

            console.log(`Resolved ${resolved.length} sites to build:`, resolved);
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `sites=${JSON.stringify(resolved)}\n`);
            fs.appendFileSync(out, `count=${resolved.length}\n`);
          '

  build-pack:
    name: Build Pack (${{ matrix.site }})
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        site: ${{ fromJson(needs.prepare-matrix.outputs.sites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build .docpack, .manifest.json & .search.json (with regression guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist-packs
          gh release download packs-latest --pattern "${{ matrix.site }}.manifest.json" --dir ./dist-packs --clobber || true
          bun run scripts/ci-build-site.ts "${{ matrix.site }}" ./dist-packs

      - name: Upload Pack to GitHub Release (packs-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upload_args=(
            "./dist-packs/${{ matrix.site }}.docpack"
            "./dist-packs/${{ matrix.site }}.manifest.json"
            "./dist-packs/${{ matrix.site }}.search.json"
          )
          if [ -f "./dist-packs/${{ matrix.site }}.delta" ]; then
            upload_args+=("./dist-packs/${{ matrix.site }}.delta")
          fi
          gh release upload packs-latest "${upload_args[@]}" --clobber

  refresh-icons:
    name: Capture Site Icons (hybrid favicon strategy)
    needs: [prepare-matrix, build-pack]
    if: always() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download previously cached icons from packs-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./docs-desktop/catalog/icons
          gh release download packs-latest --pattern "*.icon.png" --pattern "*.meta.json" --dir ./docs-desktop/catalog/icons --clobber || true

      - name: Capture missing / stale icons (cached by source ETag + content hash)
        run: bun scripts/capture-icons.ts

      - name: Upload icon assets to packs-latest
        if: always() && hashFiles('docs-desktop/catalog/icons/*.icon.png') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload packs-latest ./docs-desktop/catalog/icons/*.icon.png ./docs-desktop/catalog/icons/*.meta.json --clobber

  update-registry:
    name: Update Master registry.json
    needs: [prepare-matrix, build-pack, refresh-icons]
    if: always() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Rebuild & upload master registry.json from all release manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./rel-manifests/icons
          gh release download packs-latest --pattern "*.manifest.json" --dir ./rel-manifests --clobber
          # Icon assets feed the iconETag freshness anchors in the registry
          gh release download packs-latest --pattern "*.icon.png" --dir ./rel-manifests/icons --clobber
          bun -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const dir = "./rel-manifests";
            const iconsDir = "./rel-manifests/icons";
            const packs = {};
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".manifest.json")) continue;
              const m = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              if (!m.commit || m.commit === "e3b0c442" || !m.totalBytes) continue;
              const entry = {
                id: m.id,
                name: m.name,
                version: m.version,
                commit: m.commit,
                updatedAt: m.updatedAt,
                sizeMB: Number((m.totalBytes / (1024 * 1024)).toFixed(2)),
                totalBytes: m.totalBytes,
                chunkCount: m.chunkCount,
                routeCount: Object.keys(m.routes || {}).length,
                manifestFile: `${m.id}.manifest.json`,
                packFile: `${m.id}.docpack`,
                searchFile: `${m.id}.search.json`
              };
              const iconPath = path.join(iconsDir, `${m.id}.icon.png`);
              if (fs.existsSync(iconPath)) {
                entry.iconFile = `${m.id}.icon.png`;
                entry.iconETag = crypto.createHash("sha256").update(fs.readFileSync(iconPath)).digest("hex").slice(0, 16);
              }
              packs[m.id] = entry;
            }
            const registry = {
              version: 2,
              updatedAt: new Date().toISOString(),
              packs
            };
            fs.writeFileSync("./rel-manifests/registry.json", JSON.stringify(registry, null, 2));
            console.log("Updated registry.json with", Object.keys(packs).length, "packs!");
          '
          gh release upload packs-latest ./rel-manifests/registry.json --clobber
