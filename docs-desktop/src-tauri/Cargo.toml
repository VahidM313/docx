[package]
name = "app"
version = "1.0.0"
description = "Docx - Offline Tailwind CSS & shadcn/ui Documentation"
authors = ["Docx"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
log = "0.4"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
tauri = { version = "2.12.1", features = ["image-png", "image-ico", "custom-protocol"] }
tauri-plugin-log = "2"

[profile.dev]
incremental = true
codegen-units = 256

[profile.release]
strip = true
debug = false
opt-level = 2
codegen-units = 16
incremental = true
lto = false
panic = "abort"
